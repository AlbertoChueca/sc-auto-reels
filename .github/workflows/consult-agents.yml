name: Consult agents

# One click: every agent proposes how to raise the reels' quality scores; result in agents/consultation.md
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consult:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get install -y -qq libcairo2 && pip install -r requirements.txt
      - name: Ask the agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python consult_agents.py
      - name: Save
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add agents/consultation.md agents/consultation.json
          git diff --cached --quiet || (git commit -m "Agents consultation $(date +%F)" && (git push || (git pull --rebase && git push)))
