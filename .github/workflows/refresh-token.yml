name: Refresh Instagram token

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Refresh (and store the new token if it changed)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -c "import os,publish_ig as p; print(p.refresh_token(os.environ['IG_TOKEN']))")
          echo "::add-mask::$NEW"
          if [ "$NEW" != "$IG_TOKEN" ]; then
            if [ -n "$GH_TOKEN" ]; then
              echo "$NEW" | gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY"
              echo "Token rotated and saved."
            else
              echo "::warning::Instagram returned a new token but GH_PAT is not set, so it could not be saved."
            fi
          else
            echo "Token extended for another 60 days."
          fi
