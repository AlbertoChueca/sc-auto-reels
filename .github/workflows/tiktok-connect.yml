name: TikTok connect

on:
  workflow_dispatch:
    inputs:
      code:
        description: "The code=... value from the TikTok redirect URL"
        required: true

jobs:
  connect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Exchange code and save refresh token
        env:
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REDIRECT_URI: https://streakchess.com/
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python tiktok_auth.py "${{ inputs.code }}"
