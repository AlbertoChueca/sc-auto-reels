name: Daily reels

on:
  schedule:
    - cron: "0 16 * * *"   # story reel     -> 12:00 New York (level rotates basic/intermediate/advanced)
    - cron: "0 23 * * *"   # story tag reel -> 19:00 New York ("tag a friend" challenge)
  workflow_dispatch:
    inputs:
      level:
        description: "Premium story reel: story = normal puzzle, storytag = 'challenge a friend'"
        type: choice
        options: [story, storytag]
        default: story
      difficulty:
        description: "Puzzle level (auto = rotates every day)"
        type: choice
        options: [auto, basic, intermediate, advanced]
        default: auto
      dry_run:
        description: "Only generate the video (do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Choose slot
        id: lvl
        run: |
          case "${{ github.event.schedule }}" in
            "0 16 * * *") L=story ;;
            "0 23 * * *") L=storytag ;;
            *)            L="${{ inputs.level }}" ;;
          esac
          echo "level=$L" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 espeak-ng

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voices-v4

      - name: Download Kokoro voice
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Monthly cache key
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache puzzle database
        uses: actions/cache@v4
        with:
          path: data
          key: puzzles-${{ steps.month.outputs.m }}
          restore-keys: puzzles-

      - name: Generate and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          VOICE_ENGINE: gemini
          LEVEL_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.difficulty || 'auto' }}
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Fenrir' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python run_daily.py ${{ steps.lvl.outputs.level }}

      - name: Save video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.lvl.outputs.level }}
          path: out/**
          retention-days: 14
          if-no-files-found: ignore

      - name: Remember used puzzles and stories
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          for f in used.json log.jsonl story_log.json review_log.jsonl performance.json strategy_arms.json strategy_report.md playbook.md series.json; do [ -f "$f" ] && git add "$f"; done
          [ -d agents ] && git add agents
          git diff --cached --quiet || (git commit -m "Reel ${{ steps.lvl.outputs.level }} $(date +%F)" && (git push || (git pull --rebase && git push)))
