name: Daily reels

on:
  schedule:
    - cron: "0 13 * * *"   # tagfriend    -> 09:00 New York
    - cron: "0 16 * * *"   # basic        -> 12:00 New York
    - cron: "0 18 * * *"   # carousel     -> 14:00 New York
    - cron: "0 20 * * *"   # tagfriend    -> 16:00 New York
    - cron: "0 22 * * *"   # intermediate -> 18:00 New York
    - cron: "0 1 * * *"    # advanced     -> 21:00 New York
  workflow_dispatch:
    inputs:
      level:
        description: "What to publish"
        type: choice
        options: [basic, intermediate, advanced, tagfriend, carousel]
        default: basic
      dry_run:
        description: "Only generate (do not publish)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Choose level
        id: lvl
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * *") L=tagfriend ;;
            "0 16 * * *") L=basic ;;
            "0 18 * * *") L=carousel ;;
            "0 20 * * *") L=tagfriend ;;
            "0 22 * * *") L=intermediate ;;
            "0 1 * * *")  L=advanced ;;
            *)            L="${{ inputs.level }}" ;;
          esac
          echo "level=$L" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 espeak-ng

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0

      - name: Download voice model
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Monthly cache key
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache puzzle database
        uses: actions/cache@v4
        with:
          path: data
          key: puzzles-${{ steps.month.outputs.m }}
          restore-keys: puzzles-

      - name: Generate and publish
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python run_daily.py ${{ steps.lvl.outputs.level }}

      - name: Save video for review
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.lvl.outputs.level }}
          path: out/**
          retention-days: 14

      - name: Remember used puzzle
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add used.json log.jsonl 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Reel ${{ steps.lvl.outputs.level }} $(date +%F)" && (git push || (git pull --rebase && git push)))
