name: Story reel test

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Puzzle level"
        type: choice
        options: [basic, intermediate, advanced]
        default: intermediate

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 espeak-ng
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: voices-v4
      - run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sSL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          [ -f models/voices.bin ]  || curl -sSL -o models/voices.bin  https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data
          key: puzzles-${{ steps.month.outputs.m }}
          restore-keys: puzzles-
      - name: Generate story reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VOICE_ENGINE: gemini
          GEMINI_VOICE: ${{ vars.GEMINI_VOICE || 'Fenrir' }}
        run: python story_test.py ${{ inputs.level }}
      - uses: actions/upload-artifact@v4
        with:
          name: story-reel
          path: out/**
          retention-days: 14
