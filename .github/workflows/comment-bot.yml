name: Comment bot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what it would answer (do not reply)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: comment-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Answer new comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          BOT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python comment_bot.py
      - name: Save state
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add handled_comments.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Comment bot $(date +%F-%H%M)" && (git push || (git pull --rebase && git push)))
